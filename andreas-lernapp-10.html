<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎓 Andreas Lern-App</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;color:#fff}
    #app{max-width:500px;margin:0 auto;padding:1rem;min-height:100vh}
    .btn{width:100%;padding:1rem;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:.5rem;text-align:left;display:flex;align-items:center;gap:.75rem}
    .btn-topic{background:rgba(255,255,255,.15);color:#fff}
    .btn-topic:hover{background:rgba(255,255,255,.25)}
    .btn-primary{background:#10b981;color:#fff;justify-content:center}
    .btn-secondary{background:rgba(255,255,255,.2);color:#fff;justify-content:center}
    .btn-answer{background:rgba(255,255,255,.1);color:#fff;justify-content:center;padding:1rem}
    .btn-answer.correct{background:#10b981}
    .btn-answer.wrong{background:#ef4444}
    .back-btn{background:transparent;border:none;color:rgba(255,255,255,.8);font-size:1.2rem;cursor:pointer;padding:.5rem}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
    .tabs{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
    .tab{flex:1;padding:.75rem;border:none;border-radius:10px;background:rgba(0,0,0,.2);color:rgba(255,255,255,.6);font-weight:600;cursor:pointer;font-size:.9rem;min-width:70px}
    .tab.active{background:rgba(255,255,255,.25);color:#fff}
    .box{background:rgba(255,255,255,.15);border-radius:16px;padding:1.25rem;margin-bottom:1rem;text-align:center}
    .cat{font-size:.85rem;opacity:.7;margin:1.5rem 0 .5rem;text-transform:uppercase;letter-spacing:1px}
    
    /* Game category sections */
    .game-section{margin:1.2rem 0;padding:1rem;background:rgba(0,0,0,.15);border-radius:16px}
    .game-section-title{font-size:1rem;font-weight:700;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem;padding-bottom:.5rem;border-bottom:2px solid rgba(255,255,255,.2)}
    .game-section .btn{margin-bottom:.4rem}
    
    /* Memory grid */
    .memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:1rem 0}
    .card{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:.7rem;text-align:center;cursor:pointer;padding:3px;transition:all .3s}
    .card.flip{background:#3b82f6;color:#fff}
    .card.match{background:#10b981;color:#fff}
    .card.match-p1{background:#3b82f6;color:#fff}
    .card.match-p2{background:#ef4444;color:#fff}
    
    /* Sorting */
    .sort-item{background:rgba(255,255,255,.15);padding:.75rem;border-radius:10px;margin:.4rem 0;cursor:grab;display:flex;align-items:center;gap:.5rem}
    .sort-item:active{cursor:grabbing;background:rgba(255,255,255,.25)}
    .sort-num{background:rgba(0,0,0,.3);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.85rem}
    
    /* Simulator controls */
    .sim-display{font-size:3rem;text-align:center;padding:1.5rem;background:rgba(0,0,0,.2);border-radius:16px;margin:1rem 0}
    .sim-info{text-align:center;font-size:1.1rem;padding:.75rem;background:rgba(255,255,255,.1);border-radius:10px;margin:.5rem 0}
    input[type=range]{width:100%;margin:1rem 0;accent-color:#10b981}
    
    /* Quiz Run */
    .run-area{display:flex;gap:1rem;margin:1rem 0}
    .run-door{flex:1;padding:2rem 1rem;background:rgba(255,255,255,.1);border-radius:16px;text-align:center;cursor:pointer;border:3px solid transparent;transition:all .2s}
    .run-door:hover{background:rgba(255,255,255,.2)}
    .run-door.correct{background:#10b981;border-color:#fff}
    .run-door.wrong{background:#ef4444;border-color:#fff}
    .run-emoji{font-size:3rem;margin-bottom:.5rem}
    .lives{font-size:1.5rem;letter-spacing:3px}
    .timer{font-size:2rem;font-weight:bold}
    
    /* Lückentext */
    .luecke-input{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);border-radius:8px;padding:.5rem;color:#fff;font-size:1rem;width:80px;text-align:center;margin:0 .25rem}
    .luecke-input:focus{outline:none;border-color:#10b981}
    .luecke-input.correct{border-color:#10b981;background:rgba(16,185,129,.3)}
    .luecke-input.wrong{border-color:#ef4444;background:rgba(239,68,68,.3)}
    
    /* Stars display */
    .stars{color:#fbbf24;font-size:1.2rem;margin-left:.5rem}
    .topic-stars{font-size:.9rem;opacity:.8}
    
    /* Progress */
    .progress{height:6px;background:rgba(0,0,0,.2);border-radius:3px;margin:.5rem 0;overflow:hidden}
    .progress-bar{height:100%;background:#10b981;transition:width .3s}
    
    /* Subcategory styling */
    .subcat{font-size:.75rem;opacity:.6;margin:1rem 0 .3rem;padding-left:.5rem;border-left:3px solid rgba(255,255,255,.3)}
  </style>
</head>

// Utility
function shuffle(arr) {
  let a = [...arr];
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function saveStars(tid,s){
  let old = stars[tid] || 0;
  if(s > old){stars[tid]=s;localStorage.setItem('andreas_stars',JSON.stringify(stars));}
}

function getStarsHTML(tid){
  let s = stars[tid] || 0;
  return s > 0 ? '<span class="stars">' + '⭐'.repeat(s) + '</span>' : '';
}

function calcStars(correct,total){
  let pct = correct/total;
  if(pct >= 0.9) return 3;
  if(pct >= 0.7) return 2;
  if(pct >= 0.5) return 1;
  return 0;
}

// ============ QUIZ ============
function startQuiz(id){
  let t = topics.find(x=>x.id===id);
  topic = t;
  qs = shuffle(Q[id]).slice(0,5);
  qi = 0;
  score = 0;
  showQuestion();
}

function showQuestion(){
  if(qi >= qs.length){
    let s = calcStars(score,qs.length);
    saveStars('quiz_'+topic.id,s);
    render(`<div class="header"><button class="back-btn" onclick="showMenu()">←</button><span>${topic.icon} ${topic.name}</span></div>
      <div class="box"><h2>${score}/${qs.length} richtig!</h2><div style="font-size:2rem;margin:1rem">${'⭐'.repeat(s) || '😢'}</div>
      <button class="btn btn-primary" onclick="startQuiz('${topic.id}')">🔄 Nochmal</button>
      <button class="btn btn-secondary" onclick="showMenu()">🏠 Menü</button></div>`);
    return;
  }
  let q = qs[qi];
  let opts = shuffle(q.o);
  render(`<div class="header"><button class="back-btn" onclick="showMenu()">←</button><span>${topic.icon}</span><span>${qi+1}/${qs.length}</span></div>
    <div class="progress"><div class="progress-bar" style="width:${(qi/qs.length)*100}%"></div></div>
    <div class="box"><h3>${q.q}</h3></div>
    ${opts.map(o=>`<button class="btn btn-answer" onclick="checkAnswer(this,'${o.replace(/'/g,"\\'")}','${q.a.replace(/'/g,"\\'")}')">${o}</button>`).join('')}`);
}

function checkAnswer(btn,sel,ans){
  document.querySelectorAll('.btn-answer').forEach(b=>b.disabled=true);
  if(sel===ans){btn.classList.add('correct');score++;}
  else{btn.classList.add('wrong');document.querySelectorAll('.btn-answer').forEach(b=>{if(b.textContent===ans)b.classList.add('correct');});}
  setTimeout(()=>{qi++;showQuestion();},1000);
}

// ============ QUIZ RUN ============
let runTimer, runTime, runLives, runScore, runQs, runQi, runTarget;

function startRun(id){
  let t = topics.find(x=>x.id===id);
  topic = t;
  runQs = shuffle(Q[id]);
  runTarget = runQs.length;
  runQi = 0;
  runScore = 0;
  runLives = 3;
  runTime = 0;
  runTimer = setInterval(()=>{runTime++;updateRunTimer();},1000);
  showRunQ();
}

function updateRunTimer(){
  let el = document.getElementById('timer');
  if(el) el.textContent = runTime + 's';
}

function showRunQ(){
  if(runLives <= 0){
    clearInterval(runTimer);
    render(`<div class="header"><button class="back-btn" onclick="showMenu()">←</button><span>${topic.icon}</span></div>
      <div class="box"><h2>💔 Game Over!</h2><p>${runScore}/${runTarget} richtige Antworten</p>
      <button class="btn btn-primary" onclick="startRun('${topic.id}')">🔄 Nochmal</button>
      <button class="btn btn-secondary" onclick="showMenu()">🏠 Menü</button></div>`);
    return;
  }
  if(runScore >= runTarget){
    clearInterval(runTimer);
    let s = runTime <= 30 ? 3 : runTime <= 60 ? 2 : 1;
    saveStars('run_'+topic.id,s);
    render(`<div class="header"><button class="back-btn" onclick="showMenu()">←</button><span>${topic.icon}</span></div>
      <div class="box"><h2>🎉 Gewonnen!</h2><p>Zeit: ${runTime}s</p><div style="font-size:2rem">${'⭐'.repeat(s)}</div>
      <button class="btn btn-primary" onclick="startRun('${topic.id}')">🔄 Nochmal</button>
      <button class="btn btn-secondary" onclick="showMenu()">🏠 Menü</button></div>`);
    return;
  }
  if(runQi >= runQs.length){
    clearInterval(runTimer);
    let s = runScore >= runTarget * 0.9 ? 3 : runScore >= runTarget * 0.7 ? 2 : runScore >= runTarget * 0.5 ? 1 : 0;
    if(s > 0) saveStars('run_'+topic.id,s);
    render(`<div class="header"><button class="back-btn" onclick="showMenu()">←</button><span>${topic.icon}</span></div>
      <div class="box"><h2>🏁 Fertig!</h2><p>${runScore}/${runTarget} richtig</p><p>Zeit: ${runTime}s</p>
      <div style="font-size:2rem">${'⭐'.repeat(s)||'😢'}</div>
      <button class="btn btn-primary" onclick="startRun('${topic.id}')">🔄 Nochmal</button>
      <button class="btn btn-secondary" onclick="showMenu()">🏠 Menü</button></div>`);
    return;
  }
  
  let q = runQs[runQi];
  let wrong = q.o.filter(x=>x!==q.a);
  let wrongOpt = wrong[Math.floor(Math.random()*wrong.length)];
  let leftCorrect = Math.random() > 0.5;
  
  render(`<div class="header"><button class="back-btn" onclick="clearInterval(runTimer);showMenu()">←</button><span>${topic.icon}</span><span id="timer">${runTime}s</span></div>
    <div class="box">
      <div class="lives">${'❤️'.repeat(runLives)}${'🖤'.repeat(3-runLives)}</div>
      <p style="margin:.5rem 0">${runScore}/${runTarget}</p>
      <h3 style="font-size:1rem">${q.q}</h3>
    </div>
    <div class="run-area">
      <div class="run-door" onclick="checkRunAnswer(this,${leftCorrect})">
        <div class="run-emoji">${leftCorrect?'✓':'✗'}</div>
        <div>${leftCorrect?q.a:wrongOpt}</div>
      </div>
      <div class="run-door" onclick="checkRunAnswer(this,${!leftCorrect})">
        <div class="run-emoji">${!leftCorrect?'✓':'✗'}</div>
        <div>${!leftCorrect?q.a:wrongOpt}</div>
      </div>
    </div>`);
}

function checkRunAnswer(el,correct){
  document.querySelectorAll('.run-door').forEach(d=>d.style.pointerEvents='none');
  if(correct){el.classList.add('correct');runScore++;}
  else{el.classList.add('wrong');runLives--;}
  runQi++;
  setTimeout(showRunQ,800);
}

// ============ MEMORY ============
let memCards,memFlipped,memMatched,memLocked,memClicks;

function startMemory(id){
  let data = memoryData[id];
  if(!data) return;
  
  memCards = [];
  data.forEach((p,i)=>{
    memCards.push({id:i,text:p.a,pair:i});
    memCards.push({id:i,text:p.b,pair:i});
  });
  memCards = shuffle(memCards);
  memFlipped = [];
  memMatched = [];
  memLocked = false;
  memClicks = 0;
  
  renderMemory(id);
}

function renderMemory(id){
  let total = memCards.length/2;
  let matched = memMatched.length/2;
  
  if(matched >= total){
    let s = memClicks <= total*3 ? 3 : memClicks <= total*4 ? 2 : 1;
    saveStars('mem_'+id,s);
    render(`<div class="header"><button class="back-btn" onclick="showMenu()">←</button><span>🧠 Memory</span></div>
      <div class="box"><h2>🎉 Geschafft!</h2><p>${memClicks} Klicks</p>
      <div style="font-size:2rem">${'⭐'.repeat(s)}</div>
      <button class="btn btn-primary" onclick="startMemory('${id}')">🔄 Nochmal</button>
      <button class="btn btn-secondary" onclick="showMenu()">🏠 Menü</button></div>`);
    return;
  }
  
  let h = `<div class="header"><button class="back-btn" onclick="showMenu()">←</button><span>🧠</span><span>${matched}/${total}</span></div>
    <div class="memory-grid">`;
  
  memCards.forEach((c,i)=>{
    let isFlipped = memFlipped.includes(i);
    let isMatched = memMatched.includes(i);
    let cls = isMatched ? 'card match' : isFlipped ? 'card flip' : 'card';
    let txt = (isFlipped || isMatched) ? c.text : '?';
    h += `<div class="${cls}" onclick="flipCard(${i},'${id}')">${txt}</div>`;
  });
  
  h += `</div><p style="text-align:center;opacity:.7">Klicks: ${memClicks}</p>`;
  render(h);
}

function flipCard(i,id){
  if(memLocked || memFlipped.includes(i) || memMatched.includes(i)) return;
  
  memFlipped.push(i);
  memClicks++;
  
  if(memFlipped.length === 2){
    memLocked = true;
    let [a,b] = memFlipped;
    if(memCards[a].pair === memCards[b].pair){
      memMatched.push(a,b);
      memFlipped = [];
      memLocked = false;
      renderMemory(id);
    } else {
      renderMemory(id);
      setTimeout(()=>{
        memFlipped = [];
        memLocked = false;
        renderMemory(id);
      },1200);
    }
  } else {
    renderMemory(id);
  }
}

function startStromMemory(){
  let leiter = shuffle(stromLeiter.leiter).slice(0,4);
  let nicht = shuffle(stromLeiter.nichtleiter).slice(0,4);
  
  memCards = [];
  leiter.forEach((l,i)=>{
    memCards.push({id:i,text:l,pair:i,type:'leiter'});
    memCards.push({id:i,text:'⚡ Leiter',pair:i,type:'label'});

    memCards.push({id:i+4,text:'🚫 Nichtleiter',pair:i+4,type:'label'});
  });
  
  memCards = shuffle(memCards);
  memFlipped = [];
  memMatched = [];
  memLocked = false;
  memClicks = 0;
  
  renderMemory('strom');
}

// ============ SORTIEREN ============
let sortItems,sortId;

function startSort(id){
  sortId = id;
  sortItems = shuffle([...sortData[id].items]);
  renderSort();
}

function renderSort(){
  let h = `<div class="header"><button class="back-btn" onclick="showMenu()">←</button><span>📊 ${sortData[sortId].name}</span></div>
    <div class="box"><p>Bringe die Schritte in die richtige Reihenfolge!</p></div>`;
  
  sortItems.forEach((item,i)=>{
    h += `<div class="sort-item" draggable="true" ondragstart="dragStart(event,${i})" ondragover="dragOver(event)" ondrop="drop(event,${i})">
      <div class="sort-num">${i+1}</div>
      <span>${item}</span>
    </div>`;
  });
  
  h += `<button class="btn btn-primary" onclick="checkSort()">✓ Prüfen</button>`;
  render(h);
}

let draggedIdx = null;
function dragStart(e,i){draggedIdx=i;}
function dragOver(e){e.preventDefault();}
function drop(e,i){
  e.preventDefault();
  if(draggedIdx === null) return;
  let temp = sortItems[draggedIdx];
  sortItems.splice(draggedIdx,1);
  sortItems.splice(i,0,temp);
  draggedIdx = null;
  renderSort();
}

function checkSort(){
  let correct = sortData[sortId].items;
  let score = 0;
  sortItems.forEach((item,i)=>{if(item===correct[i])score++;});
  let s = calcStars(score,correct.length);
  saveStars('sort_'+sortId,s);
  
  render(`<div class="header"><button class="back-btn" onclick="showMenu()">←</button><span>📊</span></div>
    <div class="box"><h2>${score}/${correct.length} richtig!</h2>
    <div style="font-size:2rem">${'⭐'.repeat(s)||'😢'}</div></div>
    <div class="box"><p><strong>Richtige Reihenfolge:</strong></p>
    ${correct.map((c,i)=>`<p>${i+1}. ${c}</p>`).join('')}</div>
    <button class="btn btn-primary" onclick="startSort('${sortId}')">🔄 Nochmal</button>
    <button class="btn btn-secondary" onclick="showMenu()">🏠 Menü</button>`);
}

// ============ ZUORDNEN ============
let zuItems,zuId,zuScore;

function startZuordnen(id){
  zuId = id;
  zuItems = shuffle([...zuordnen[id].items]);
  zuScore = 0;
  showZuordnen();
}

function showZuordnen(){
  if(zuItems.length === 0){
    let total = zuordnen[zuId].items.length;
    let s = calcStars(zuScore,total);
    saveStars('zu_'+zuId,s);
    render(`<div class="header"><button class="back-btn" onclick="showMenu()">←</button><span>🎯</span></div>
      <div class="box"><h2>${zuScore}/${total} richtig!</h2>
      <div style="font-size:2rem">${'⭐'.repeat(s)||'😢'}</div>
      <button class="btn btn-primary" onclick="startZuordnen('${zuId}')">🔄 Nochmal</button>
      <button class="btn btn-secondary" onclick="showMenu()">🏠 Menü</button></div>`);
    return;
  }
  
  let item = zuItems[0];
  let data = zuordnen[zuId];
  
  render(`<div class="header"><button class="back-btn" onclick="showMenu()">←</button><span>🎯 ${data.name}</span></div>
    <div class="box"><h2>${item.text}</h2></div>
    <div class="run-area">
      <div class="run-door" onclick="checkZu('l','${item.cat}')">
        <div class="run-emoji">👈</div>
        <div>${data.left}</div>
      </div>
      <div class="run-door" onclick="checkZu('r','${item.cat}')">
        <div class="run-emoji">👉</div>
        <div>${data.right}</div>
      </div>
    </div>
    <p style="text-align:center;opacity:.7">Noch ${zuItems.length} übrig</p>`);
}

function checkZu(choice,correct){
  document.querySelectorAll('.run-door').forEach(d=>d.style.pointerEvents='none');
  let doors = document.querySelectorAll('.run-door');
  if(choice === correct){
    zuScore++;
    doors[choice==='l'?0:1].classList.add('correct');
  } else {
    doors[choice==='l'?0:1].classList.add('wrong');
    doors[choice==='l'?1:0].classList.add('correct');
  }
  zuItems.shift();
  setTimeout(showZuordnen,700);
}

// ============ LÜCKENTEXT ============
let lueckeData,lueckeId,lueckeI;

function startLuecke(id){
  lueckeId = id;
  lueckeData = shuffle([...luecken[id]]);
  lueckeI = 0;
  showLuecke();
}

function showLuecke(){
  if(lueckeI >= lueckeData.length){
    render(`<div class="header"><button class="back-btn" onclick="showMenu()">←</button><span>✏️</span></div>
      <div class="box"><h2>🎉 Geschafft!</h2>
      <button class="btn btn-primary" onclick="startLuecke('${lueckeId}')">🔄 Nochmal</button>
      <button class="btn btn-secondary" onclick="showMenu()">🏠 Menü</button></div>`);
    return;
  }
  
  let q = lueckeData[lueckeI];
  let parts = q.text.split('___');
  
  render(`<div class="header"><button class="back-btn" onclick="showMenu()">←</button><span>✏️</span><span>${lueckeI+1}/${lueckeData.length}</span></div>
    <div class="progress"><div class="progress-bar" style="width:${(lueckeI/lueckeData.length)*100}%"></div></div>
    <div class="box" style="font-size:1.1rem;line-height:2">
      ${parts[0]}<input type="text" class="luecke-input" id="lueckeInput" autocomplete="off">${parts[1] || ''}
    </div>
    <button class="btn btn-primary" onclick="checkLuecke()">✓ Prüfen</button>`);
  
  document.getElementById('lueckeInput').focus();
}

function checkLuecke(){
  let input = document.getElementById('lueckeInput');
  let val = input.value.trim();
  let q = lueckeData[lueckeI];
  
  if(q.accept.some(a => a.toLowerCase() === val.toLowerCase())){
    input.classList.add('correct');
    setTimeout(()=>{lueckeI++;showLuecke();},800);
  } else {
    input.classList.add('wrong');
    setTimeout(()=>{
      input.value = q.answer;
      input.classList.remove('wrong');
      input.classList.add('correct');
      setTimeout(()=>{lueckeI++;showLuecke();},1200);
    },800);
  }
}

// ============ 3D RUNNER (Original-Grafik) ============
let runnerActive = false;
let runnerCanvas, runnerCtx;
let rScore, rCurrentQ, rQuestions, rPlayerLane, rTargetLane, rSpeed, rObstacles, rParticles, rTopicId, rLives;
const LANE_COLORS = ['#f72585', '#8b5cf6', '#4cc9f0'];

function start3DRunner(id){
  rTopicId = id;
  let t = topics.find(x=>x.id===id);
  
  rQuestions = shuffle(Q[id]).slice(0,10).map(q => {
    let wrongOpts = q.o.filter(o => o !== q.a);
    let wrongs = shuffle(wrongOpts).slice(0,2);
    let correctLane = Math.floor(Math.random()*3);
    let answers = [];
    for(let i=0; i<3; i++){
      if(i === correctLane) answers.push({text: q.a, correct: true});
      else answers.push({text: wrongs.pop() || '???', correct: false});
    }
    return { question: q.q, answers: answers, correctLane: correctLane };
  });
  
  render(`<div id="runner-container" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0f0a1a;z-index:1000;display:flex;flex-direction:column">
    <div style="padding:8px;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.5)">
      <button onclick="exitRunner()" style="background:#f72585;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:bold">✕</button>
      <div id="rQuestion" style="flex:1;background:rgba(0,0,0,.6);color:#fff;padding:10px;border-radius:10px;text-align:center;font-size:14px;border:2px solid #4cc9f0">${t.icon} ${t.name}</div>
      <div id="rScore" style="background:rgba(0,0,0,.6);color:#4cc9f0;padding:10px 14px;border-radius:10px;font-weight:bold;border:2px solid #4cc9f0">0⭐</div>
    </div>
    <div id="rLives" style="text-align:center;font-size:24px;padding:5px">❤️❤️❤️</div>
    <canvas id="rCanvas" style="flex:1;display:block"></canvas>
    <div style="padding:10px;background:rgba(0,0,0,.5)">
      <div id="rProgress" style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-bottom:10px">
        <div id="rProgressBar" style="height:100%;background:linear-gradient(90deg,#f72585,#4cc9f0);width:0%;transition:width .3s"></div>
      </div>
      <div style="display:flex;justify-content:center;gap:15px">
        <button id="rLeftBtn" style="width:70px;height:70px;border-radius:50%;border:none;font-size:28px;background:linear-gradient(135deg,#f72585,#b5179e);color:#fff;box-shadow:0 4px 20px rgba(247,37,133,.5)">◀</button>
        <button id="rMidBtn" style="width:70px;height:70px;border-radius:50%;border:none;font-size:28px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;box-shadow:0 4px 20px rgba(139,92,246,.5)">●</button>
        <button id="rRightBtn" style="width:70px;height:70px;border-radius:50%;border:none;font-size:28px;background:linear-gradient(135deg,#4cc9f0,#4361ee);color:#fff;box-shadow:0 4px 20px rgba(76,201,240,.5)">▶</button>
      </div>
    </div>
    <div id="rFeedback" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;opacity:0;transition:opacity .2s;pointer-events:none;text-shadow:0 0 30px currentColor"></div>
    <div id="rStart" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;padding:20px;text-align:center">
      <h1 style="font-size:32px;margin-bottom:10px">🏃 Quiz Runner</h1>
      <p style="color:#4cc9f0;font-size:18px;margin-bottom:5px">${t.icon} ${t.name}</p>
      <p style="color:#aaa;margin-bottom:20px;font-size:14px">Weiche den falschen Antworten aus!<br>Sammle die richtigen ein!</p>
      <div style="display:flex;gap:10px;margin-bottom:20px">
        <div style="text-align:center;padding:10px;background:rgba(247,37,133,.3);border-radius:10px"><div style="font-size:24px">◀</div><div style="font-size:12px;color:#f72585">Links</div></div>
        <div style="text-align:center;padding:10px;background:rgba(139,92,246,.3);border-radius:10px"><div style="font-size:24px">●</div><div style="font-size:12px;color:#8b5cf6">Mitte</div></div>
        <div style="text-align:center;padding:10px;background:rgba(76,201,240,.3);border-radius:10px"><div style="font-size:24px">▶</div><div style="font-size:12px;color:#4cc9f0">Rechts</div></div>
      </div>
      <button onclick="startRunnerGame()" style="background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;padding:18px 50px;font-size:22px;border-radius:50px;box-shadow:0 5px 30px rgba(16,185,129,.5)">▶ START</button>
    </div>
    <div id="rEnd" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff;padding:20px;text-align:center">
      <h1 style="font-size:32px;margin-bottom:15px">🏁 Geschafft!</h1>
      <div id="rFinalScore" style="font-size:36px;color:#4cc9f0;margin:10px 0">0 ⭐</div>
      <div id="rFinalStars" style="font-size:48px;margin:10px 0"></div>
      <p id="rResult" style="color:#aaa;margin-bottom:20px"></p>
      <button onclick="startRunnerGame()" style="background:linear-gradient(135deg,#4cc9f0,#4361ee);color:#fff;border:none;padding:15px 40px;font-size:18px;border-radius:50px;margin-bottom:10px">🔄 Nochmal</button>
      <button onclick="exitRunner()" style="background:rgba(255,255,255,.2);color:#fff;border:none;padding:12px 35px;font-size:16px;border-radius:50px">🏠 Menü</button>
    </div>
  </div>`);
  
  runnerCanvas = document.getElementById('rCanvas');
  runnerCtx = runnerCanvas.getContext('2d');
  resizeRunnerCanvas();
  window.addEventListener('resize', resizeRunnerCanvas);
  
  document.getElementById('rLeftBtn').addEventListener('click', ()=>rMoveTo(0));
  document.getElementById('rLeftBtn').addEventListener('touchstart', e=>{e.preventDefault();rMoveTo(0);});
  document.getElementById('rMidBtn').addEventListener('click', ()=>rMoveTo(1));
  document.getElementById('rMidBtn').addEventListener('touchstart', e=>{e.preventDefault();rMoveTo(1);});
  document.getElementById('rRightBtn').addEventListener('click', ()=>rMoveTo(2));
  document.getElementById('rRightBtn').addEventListener('touchstart', e=>{e.preventDefault();rMoveTo(2);});
  
  document.addEventListener('keydown', rKeyHandler);
  
  let touchStartX = 0;
  runnerCanvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
  runnerCanvas.addEventListener('touchend', e => {
    let diff = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(diff) > 30){
      if(diff < 0 && rPlayerLane > 0) rMoveTo(rPlayerLane - 1);
      else if(diff > 0 && rPlayerLane < 2) rMoveTo(rPlayerLane + 1);
    }
  });
  
  rRender();
}

function resizeRunnerCanvas(){
  if(!runnerCanvas) return;
  runnerCanvas.width = runnerCanvas.offsetWidth;
  runnerCanvas.height = runnerCanvas.offsetHeight;
}

function rKeyHandler(e){
  if(!runnerActive) return;
  if(e.key === 'ArrowLeft' || e.key === 'a') { if(rPlayerLane > 0) rMoveTo(rPlayerLane - 1); }
  else if(e.key === 'ArrowRight' || e.key === 'd') { if(rPlayerLane < 2) rMoveTo(rPlayerLane + 1); }
  else if(e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') { rMoveTo(1); }
}

function exitRunner(){
  runnerActive = false;
  document.removeEventListener('keydown', rKeyHandler);
  window.removeEventListener('resize', resizeRunnerCanvas);
  showMenu();
}

function rMoveTo(lane){
  if(runnerActive && lane >= 0 && lane <= 2) rTargetLane = lane;
}

function rRender(){
  let ctx = runnerCtx, w = runnerCanvas.width, h = runnerCanvas.height;
  let laneWidth = w / 3;
  
  let grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#1a0a2e');
  grad.addColorStop(1,'#0a1a2e');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
  
  for(let i=0; i<3; i++){
    let x = i * laneWidth;
    ctx.fillStyle = `rgba(${i===0?'247,37,133':i===1?'139,92,246':'76,201,240'},0.1)`;
    ctx.fillRect(x+2, 0, laneWidth-4, h);
    
    ctx.strokeStyle = LANE_COLORS[i];
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
    ctx.globalAlpha = 1;
    
    ctx.fillStyle = LANE_COLORS[i];
    ctx.font = 'bold 12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(i===0?'◀ LINKS':i===1?'● MITTE':'RECHTS ▶', x + laneWidth/2, 20);
  }
  
  ctx.strokeStyle = LANE_COLORS[2];
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.moveTo(w, 0);
  ctx.lineTo(w, h);
  ctx.stroke();
  ctx.globalAlpha = 1;
  
  let time = Date.now() * 0.003;
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 2;
  for(let i=0; i<10; i++){
    let y = ((time * 100 + i * (h/10)) % h);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }
  
  if(rObstacles){
    rObstacles.forEach(obs => {
      let x = obs.lane * laneWidth + laneWidth/2;
      let boxW = laneWidth - 20;
      let boxH = 70;
      
      ctx.fillStyle = obs.lane === 0 ? 'rgba(247,37,133,0.85)' : 
                      obs.lane === 1 ? 'rgba(139,92,246,0.85)' : 'rgba(76,201,240,0.85)';
      ctx.strokeStyle = LANE_COLORS[obs.lane];
      ctx.lineWidth = 3;
      
      let bx = x - boxW/2, by = obs.y - boxH/2;
      ctx.beginPath();
      ctx.roundRect(bx, by, boxW, boxH, 12);
      ctx.fill();
      ctx.stroke();
      
      ctx.font = 'bold 13px system-ui';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      let text = obs.text;
      if(text.length > 12){
        let words = text.split(' ');
        let line1 = '', line2 = '';
        words.forEach(w => {
          if(line1.length + w.length < 14) line1 += (line1 ? ' ' : '') + w;
          else line2 += (line2 ? ' ' : '') + w;
        });
        ctx.fillText(line1, x, obs.y - 5);
        ctx.fillText(line2, x, obs.y + 12);
      } else {
        ctx.fillText(text, x, obs.y + 5);
      }
    });
  }
  
  let playerX = (rPlayerLane + (rTargetLane - rPlayerLane) * 0.3) * laneWidth + laneWidth/2;
  let playerY = h - 80;
  
  ctx.shadowBlur = 25;
  ctx.shadowColor = '#00ff88';
  
  ctx.fillStyle = '#00ff88';
  ctx.beginPath();
  ctx.moveTo(playerX, playerY - 30);
  ctx.lineTo(playerX - 20, playerY + 10);
  ctx.lineTo(playerX + 20, playerY + 10);
  ctx.closePath();
  ctx.fill();
  
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(playerX - 6, playerY - 12, 3, 0, Math.PI*2);
  ctx.arc(playerX + 6, playerY - 12, 3, 0, Math.PI*2);
  ctx.fill();
  
  for(let i=1; i<=4; i++){
    ctx.fillStyle = `rgba(0,255,136,${0.3-i*0.07})`;
    ctx.beginPath();
    ctx.arc(playerX, playerY + 10 + i*12, 12 - i*2, 0, Math.PI*2);
    ctx.fill();
  }
  
  if(rParticles){
    rParticles = rParticles.filter(p => p.life > 0);
    rParticles.forEach(p => {
      ctx.fillStyle = `rgba(${p.color},${p.life})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
      ctx.fill();
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.03;
    });
  }
}

function rCreateParticles(x, y, color, count){
  for(let i=0; i<count; i++){
    rParticles.push({
      x: x, y: y,
      vx: (Math.random()-0.5) * 12,
      vy: (Math.random()-0.5) * 12,
      size: Math.random() * 8 + 4,
      life: 1,
      color: color
    });
  }
}

function startRunnerGame(){
  document.getElementById('rStart').style.display = 'none';
  document.getElementById('rEnd').style.display = 'none';
  
  rScore = 0;
  rCurrentQ = 0;
  rPlayerLane = 1;
  rTargetLane = 1;
  rSpeed = 1.5;
  rObstacles = [];
  rParticles = [];
  rLives = 3;
  
  loadNextQuestion();
  updateRunnerUI();
  
  runnerActive = true;
  rGameLoop();
}

function loadNextQuestion(){
  if(rCurrentQ >= rQuestions.length) return;
  
  let q = rQuestions[rCurrentQ];
  document.getElementById('rQuestion').textContent = q.question;
  
  let startY = -150;
  for(let i=0; i<3; i++){
    rObstacles.push({
      lane: i,
      y: startY,
      text: q.answers[i].text,
      correct: q.answers[i].correct,
      passed: false
    });
  }
}

function updateRunnerUI(){
  document.getElementById('rScore').textContent = rScore + '⭐';
  document.getElementById('rLives').textContent = '❤️'.repeat(rLives) + '🖤'.repeat(3-rLives);
  document.getElementById('rProgressBar').style.width = ((rCurrentQ+1) / rQuestions.length * 100) + '%';
}

function rShowFeedback(correct){
  let fb = document.getElementById('rFeedback');
  fb.textContent = correct ? '✓' : '✗';
  fb.style.color = correct ? '#00ff88' : '#ff4444';
  fb.style.opacity = '1';
  setTimeout(() => fb.style.opacity = '0', 500);
}

function rGameLoop(){
  if(!runnerActive) return;
  
  rPlayerLane += (rTargetLane - rPlayerLane) * 0.2;
  
  rObstacles.forEach(obs => {
    obs.y += rSpeed;
  });
  
  let playerY = runnerCanvas.height - 80;
  let laneWidth = runnerCanvas.width / 3;
  
  rObstacles = rObstacles.filter(obs => {
    let playerLaneRounded = Math.round(rPlayerLane);
    if(Math.abs(obs.y - playerY) < 40 && obs.lane === playerLaneRounded && !obs.passed){
      obs.passed = true;
      
      let px = obs.lane * laneWidth + laneWidth/2;
      
      if(obs.correct){
        rScore += 10;
        rCreateParticles(px, playerY, '0,255,136', 25);
        rShowFeedback(true);
        
        rCurrentQ++;
        updateRunnerUI();
        
        if(rCurrentQ >= rQuestions.length){
          setTimeout(rEndGame, 800);
        } else {
          setTimeout(loadNextQuestion, 1200);
        }
        
        return false;
      } else {
        rLives--;
        rCreateParticles(px, playerY, '255,68,68', 25);
        rShowFeedback(false);
        updateRunnerUI();
        
        rObstacles.forEach(o => o.passed = true);
        
        rCurrentQ++;
        
        if(rLives <= 0 || rCurrentQ >= rQuestions.length){
          setTimeout(rEndGame, 800);
        } else {
          setTimeout(loadNextQuestion, 1000);
        }
        
        return false;
      }
    }
    
    if(obs.y > runnerCanvas.height + 50 && obs.correct && !obs.passed){
      obs.passed = true;
      rObstacles.forEach(o => o.passed = true);
      
      rLives--;
      rShowFeedback(false);
      updateRunnerUI();
      
      rCurrentQ++;
      if(rLives <= 0 || rCurrentQ >= rQuestions.length){
        setTimeout(rEndGame, 500);
      } else {
        setTimeout(loadNextQuestion, 1000);
      }
      return false;
    }
    
    if(obs.y > runnerCanvas.height + 50 && !obs.correct){
      return false;
    }
    
    return obs.y < runnerCanvas.height + 100;
  });
  
  rRender();
  requestAnimationFrame(rGameLoop);
}

function rEndGame(){
  runnerActive = false;
  let maxScore = rQuestions.length * 10;
  let pct = Math.round((rScore/maxScore)*100);
  let s = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
  saveStars('3d_'+rTopicId, s);
  
  let resultText = pct >= 90 ? '🏆 Fantastisch!' : pct >= 70 ? '🌟 Super gemacht!' : pct >= 50 ? '👍 Gut!' : '💪 Weiter üben!';
  
  document.getElementById('rFinalScore').textContent = rScore + ' / ' + maxScore + ' Punkte';
  document.getElementById('rFinalStars').textContent = '⭐'.repeat(s) || '😢';
  document.getElementById('rResult').textContent = resultText;
  document.getElementById('rEnd').style.display = 'flex';
}

// Start
showMenu();
</script>
</body>
